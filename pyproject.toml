[project]
name = "ThermoProp"
version = "2.6.0"
requires-python = ">=3.13"
dependencies = [
    "coolprop>=7.2.0",
    "matplotlib>=3.10.9",
    "numpy>=2.4.6",
    "openpyxl>=3.1.5",
    "pandas>=3.0.3",
    "pint>=0.25.3",
    "pyside6>=6.11.1",
]

[project.scripts]
thermoprop = "thermoprop.app:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/thermoprop"]

[dependency-groups]
dev = [
    "pyinstaller>=6.20.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
